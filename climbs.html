
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb | Burlington Buildering</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #154734;
}

body {
  background: #e9dfb9;
  color: #252820;
  font-family: Arial, Helvetica, sans-serif;
  max-width: 1000px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 36px 38px 22px;
  line-height: 1.55;
  border-left: 1px solid #c5b887;
  border-right: 1px solid #c5b887;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: -0.5px;
  color: #154734;
}

h2 {
  font-size: 19px;
  color: #154734;
  margin-top: 32px;
  border-bottom: 1px solid #a69e7f;
  padding-bottom: 6px;
}

a {
  color: #174c7e;
}

a:visited {
  color: #654478;
}

a:hover {
  text-decoration: none;
}

/* Name and grade on the same line */
.climb-heading {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 16px;
}

.grade {
  font-size: 23px;
  font-weight: 600;
  color: #154734;
  white-space: nowrap;
}

header {
  padding-bottom: 16px;
  border-bottom: 2px solid #154734;
}

header p {
  margin: 8px 0 0;
}

nav {
  border-top: 1px solid #a69e7f;
  border-bottom: 1px solid #a69e7f;
  padding: 10px 0;
  margin: 20px 0;
}

nav a {
  margin-right: 18px;
}

.muted {
  color: #565b50;
  font-size: 13px;
}

#photo {
  margin-top: 15px;
}

#photo img {
  display: block;
  width: 33%;
  max-width: 250px;
  height: auto;
  cursor: zoom-in;
}

#photo img:hover {
  opacity: 0.85;
}

#video iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  border: 0;
}

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  align-items: center;
  justify-content: center;
  z-index: 1000;
  cursor: zoom-out;
}

#lightbox img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
}

#climb-navigation {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-top: 40px;
}

#climb-navigation a {
  max-width: 48%;
  margin-right: 0;
}

#next-climb {
  text-align: right;
  margin-left: auto;
}

footer {
  border-top: 1px solid #a69e7f;
  margin-top: 50px;
  padding-top: 12px;
  font-size: 12px;
  color: #565b50;
}

@media (max-width: 600px) {
  body {
    padding: 24px 18px;
  }

  h1 {
    font-size: 26px;
  }

  .grade {
    font-size: 21px;
  }
}
</style>
</head>

<body>

<header>
  <div class="climb-heading">
    <h1 id="name">Loading climb...</h1>
    <span class="grade" id="grade"></span>
  </div>
  <p id="area"></p>
</header>

<nav>
  <a href="index.html">← All areas</a>
  <a id="back-area" href="index.html">Area page</a>
</nav>

<main>

  <p>
    <b>Location:</b>
    <span id="location"></span>
  </p>

  <h2>Description</h2>
  <p id="description" style="white-space: pre-line;"></p>

  <div id="video"></div>

  <section id="photo-section" hidden>
    <h2>Photograph</h2>
    <div id="photo"></div>
  </section>

  <nav id="climb-navigation" aria-label="Previous and next climbs">
    <a id="previous-climb" href="#" hidden></a>
    <a id="next-climb" href="#" hidden></a>
  </nav>

</main>

<div id="lightbox"
     role="dialog"
     aria-modal="true"
     aria-label="Enlarged photograph"
     tabindex="-1">
  <img id="lightbox-image" alt="">
</div>

<footer>Burlington Buildering</footer>

<script>
async function loadClimb() {
  try {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      throw new Error('No climb ID provided');
    }

    const version = Date.now();

    const [climbResponse, areaResponse] = await Promise.all([
      fetch('climbs.json?v=' + version, {
        cache: 'no-store'
      }),
      fetch('areas.json?v=' + version, {
        cache: 'no-store'
      })
    ]);

    if (!climbResponse.ok || !areaResponse.ok) {
      throw new Error('Could not load climb data');
    }

    const climbs = await climbResponse.json();
    const areas = await areaResponse.json();

    const climb = climbs.find(c => c.id === id);

    if (!climb) {
      throw new Error('Climb not found');
    }

    // Basic information
    document.title =
      climb.name + ' | Burlington Buildering';

    document.getElementById('name').textContent =
      climb.name;

    document.getElementById('grade').textContent =
      climb.grade || 'Ungraded';

    document.getElementById('area').textContent =
      climb.area || '';

    document.getElementById('location').textContent =
      climb.location || 'Location details coming soon.';

    document.getElementById('description').textContent =
      climb.description || 'Description coming soon.';

    // Link back to area
    const area = areas.find(a =>
      a.name.trim().toLowerCase() ===
      (climb.area || '').trim().toLowerCase()
    );

    if (area) {
      document.getElementById('back-area').href =
        'area.html?id=' + encodeURIComponent(area.id);
    }

    // Previous and next climbs in the same area
    const areaClimbs = climbs.filter(c =>
      (c.area || '').trim().toLowerCase() ===
      (climb.area || '').trim().toLowerCase()
    );

    const currentIndex = areaClimbs.findIndex(c => c.id === id);

    const previousLink =
      document.getElementById('previous-climb');

    const nextLink =
      document.getElementById('next-climb');

    if (currentIndex > 0) {
      const previous = areaClimbs[currentIndex - 1];

      previousLink.href =
        'climbs.html?id=' + encodeURIComponent(previous.id);

      previousLink.textContent = '← ' + previous.name;
      previousLink.hidden = false;
    }

    if (currentIndex >= 0 &&
        currentIndex < areaClimbs.length - 1) {
      const next = areaClimbs[currentIndex + 1];

      nextLink.href =
        'climbs.html?id=' + encodeURIComponent(next.id);

      nextLink.textContent = next.name + ' →';
      nextLink.hidden = false;
    }

    // Photograph
    const photoSection =
      document.getElementById('photo-section');

    const photoContainer =
      document.getElementById('photo');

    photoContainer.replaceChildren();

    if (climb.image && climb.image.trim()) {
      const img = document.createElement('img');

      img.src = climb.image.trim();
      img.alt = climb.name;
      img.title = 'Click to enlarge';

      img.onload = function() {
        photoSection.hidden = false;
      };

      img.onerror = function() {
        photoSection.hidden = true;
        console.warn('Could not load image:', img.src);
      };

      img.onclick = function() {
        openLightbox(img.src, img.alt);
      };

      photoContainer.appendChild(img);
    }

    // YouTube video
    const videoContainer =
      document.getElementById('video');

    videoContainer.replaceChildren();

    if (climb.video && climb.video.trim()) {
      const heading = document.createElement('h2');
      heading.textContent = 'Video';

      const iframe = document.createElement('iframe');

      let videoURL = climb.video.trim();
      let youtubeID = '';

      try {
        const url = new URL(videoURL);

        if ([
          'youtube.com',
          'www.youtube.com',
          'm.youtube.com'
        ].includes(url.hostname)) {

          if (url.pathname === '/watch') {
            youtubeID = url.searchParams.get('v') || '';
          } else if (
            url.pathname.startsWith('/embed/') ||
            url.pathname.startsWith('/shorts/') ||
            url.pathname.startsWith('/live/')
          ) {
            youtubeID = url.pathname.split('/')[2];
          }

        } else if ([
          'youtu.be',
          'www.youtu.be'
        ].includes(url.hostname)) {
          youtubeID = url.pathname.split('/')[1];
        }

        if (/^[a-zA-Z0-9_-]{11}$/.test(youtubeID)) {
          videoURL =
            'https://www.youtube-nocookie.com/embed/' +
            youtubeID;
        }

      } catch (error) {
        console.warn('Invalid video URL:', videoURL);
      }

      iframe.src = videoURL;
      iframe.title = climb.name + ' beta video';
      iframe.loading = 'lazy';
      iframe.allow =
        'accelerometer; autoplay; clipboard-write; ' +
        'encrypted-media; gyroscope; picture-in-picture; ' +
        'web-share';
      iframe.allowFullscreen = true;

      const link = document.createElement('p');
      const watchLink = document.createElement('a');

      watchLink.href = climb.video;
      watchLink.target = '_blank';
      watchLink.rel = 'noopener noreferrer';
      watchLink.textContent = 'Open video in a new tab';

      link.appendChild(watchLink);

      videoContainer.append(heading, iframe, link);
    }

  } catch (error) {
    document.getElementById('name').textContent =
      'Climb unavailable';

    const message = document.createElement('p');
    message.textContent = error.message;

    document.querySelector('main').prepend(message);
    console.error(error);
  }
}

// Image enlargement
const lightbox = document.getElementById('lightbox');
const lightboxImage =
  document.getElementById('lightbox-image');

function openLightbox(src, alt) {
  lightboxImage.src = src;
  lightboxImage.alt = alt;
  lightbox.style.display = 'flex';
  lightbox.focus();
}

function closeLightbox() {
  lightbox.style.display = 'none';
  lightboxImage.removeAttribute('src');
}

lightbox.addEventListener('click', closeLightbox);

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeLightbox();
  }
});

loadClimb();
</script>

</body>
</html>
